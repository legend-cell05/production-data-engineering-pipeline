[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "production-data-engineering-pipeline"
version = "1.0.0"
description = "Incremental data-engineering pipeline: multi-source ingestion with watermarks, dead-letter queue and backfill, into a partitioned PostgreSQL warehouse."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Ayman Bara" }]
keywords = ["data-engineering", "etl", "elt", "incremental", "postgresql", "fastapi"]
classifiers = [
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Database",
    "Topic :: System :: Distributed Computing",
]

dependencies = [
    "pandas>=2.1,<3.0",
    "numpy>=1.26,<3.0",
    "SQLAlchemy>=2.0,<3.0",
    "psycopg[binary]>=3.1,<4.0",
    "pydantic>=2.6,<3.0",
    "pydantic-settings>=2.2,<3.0",
    "python-dotenv>=1.0,<2.0",
    "typer>=0.12,<1.0",
    "rich>=13.7,<15.0",
    "httpx>=0.27,<1.0",
    "fastapi>=0.110,<1.0",
    "uvicorn[standard]>=0.29,<1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
    "pytest-cov>=5.0,<7.0",
    "ruff>=0.4,<1.0",
    "mypy>=1.9,<2.0",
    "pandas-stubs>=2.1",
]

[project.urls]
Homepage = "https://github.com/legend-cell05/production-data-engineering-pipeline"
Repository = "https://github.com/legend-cell05/production-data-engineering-pipeline"

[project.scripts]
helios = "helios.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
helios = ["py.typed"]

# ---------------------------------------------------------------------------
# Ruff
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "N", "SIM", "PTH", "RUF", "ASYNC"]
ignore = [
    "E501",  # handled by the formatter
    "B008",  # FastAPI dependency injection relies on calls in defaults
]

[tool.ruff.lint.per-file-ignores]
# N818 wants every exception to end in "Error". `ContractViolation` and
# `RetryBudgetExhausted` read better at the call site than
# `ContractViolationError` and `RetryBudgetExhaustedError`, and both are
# unambiguously exceptions from their base class.
"src/helios/exceptions.py" = ["N818"]

[tool.ruff.format]
quote-style = "double"

# ---------------------------------------------------------------------------
# mypy
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.11"
files = ["src"]
warn_unused_ignores = true
warn_redundant_casts = true
warn_return_any = true
disallow_untyped_defs = true
no_implicit_optional = true
show_error_codes = true

[[tool.mypy.overrides]]
module = ["pandas.*"]
ignore_missing_imports = true

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "integration: requires a live PostgreSQL (set HELIOS_RUN_INTEGRATION=1)",
]

[tool.coverage.run]
source = ["src/helios"]
branch = true

[tool.coverage.report]
show_missing = true
skip_empty = true
